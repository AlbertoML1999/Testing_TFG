name: CI - Basic

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'

jobs:

  server-quality:
    name: Server - Basic CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile Server
        run: |
          cd backend
          mvn clean compile
      - name: Run backend unitary tests
        run: |
          cd backend
          mvn -Dtest=es.goeventsnow.backend.unit.EventTest test 
        
  client-quality:
    name: Client - Basic CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: | 
          cd frontend
          npm install
      - name: Build project
        run: |
          cd frontend
          npx ng build --configuration=production       
      - name: Run frontend unitary tests
        run: |
          cd frontend
          npx ng test --include=src/app/app.component.spec.ts
